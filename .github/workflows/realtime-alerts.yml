name: BEGD real-time email alerts
on:
  workflow_run:
    workflows: [Refresh live data and publish BEGD]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: begd-realtime-alerts
  cancel-in-progress: false
jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check email configuration
        id: config
        env:
          BEGD_SMTP_USER: ${{ secrets.BEGD_SMTP_USER }}
          BEGD_SMTP_PASSWORD: ${{ secrets.BEGD_SMTP_PASSWORD }}
          BEGD_ALERT_TO: ${{ vars.BEGD_ALERT_TO }}
        run: |
          if [ -z "$BEGD_SMTP_USER" ] || [ -z "$BEGD_SMTP_PASSWORD" ] || [ -z "$BEGD_ALERT_TO" ]; then
            echo '::warning::Email alerts are not active. Set BEGD_SMTP_USER and BEGD_SMTP_PASSWORD secrets and the BEGD_ALERT_TO repository variable.'
            echo 'Email alerts are not active: email configuration is missing. No alert checkpoint was advanced.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Download exactly the refreshed Pages snapshot
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .cache/alert-pages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check new ERP readings and email anomalies
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEGD_SMTP_USER: ${{ secrets.BEGD_SMTP_USER }}
          BEGD_SMTP_PASSWORD: ${{ secrets.BEGD_SMTP_PASSWORD }}
          BEGD_ALERT_TO: ${{ vars.BEGD_ALERT_TO }}
        run: python scripts/realtime_alerts.py --pages-archive .cache/alert-pages/artifact.tar
