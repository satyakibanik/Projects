name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Install dependencies directly: optional Actions pip-cache restores can stall
# until the job timeout when the account's cache egress allowance is exhausted.
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  browser:
    name: Browser scripts and site assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
  forecast:
    name: Independent forecast inputs and models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-forecast.txt
      - run: python -m unittest discover -s tests -p 'test_daily_forecast.py' -v
      - run: python -m unittest discover -s tests -p 'test_erp_independent.py' -v
  mobile-layers:
    name: Layer controls keep browser scroll position
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/fuel-legends-p1.cjs
      - run: node tests/browser/fuel-history-performance.cjs
      - run: node tests/browser/ewic-map-lifecycle.cjs
      - run: node tests/browser/energy-data-and-notes.cjs
      - run: node tests/browser/phone-legibility.cjs
      - run: node tests/browser/comparison-layout.cjs
      - run: node tests/browser/operational-events.cjs
      - run: node tests/browser/cost-water.cjs
      - run: node tests/browser/realtime-yesterday.cjs
      - run: node tests/browser/mobile-layers.cjs
      - run: node tests/browser/chart-touch.cjs
  figure-exports:
    name: Download every dashboard figure as a valid PNG
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Seed the preview with the latest published data
        env:
          BEGD_LIVE_BASE_URL: https://satyakibanik.github.io/Projects/begd
        run: |
          curl --fail --silent --show-error "$BEGD_LIVE_BASE_URL/live-data.js" -o begd/live-data.js
          curl --fail --silent --show-error "$BEGD_LIVE_BASE_URL/current-day.json" -o begd/current-day.json
          curl --fail --silent --show-error "$BEGD_LIVE_BASE_URL/trends-data.json" -o begd/trends-data.json
          sed -i 's|<script src="app.js?v=|<script src="live-data.js"></script><script src="static-api.js?v=current-day-v2"></script><script src="app.js?v=|' begd/index.html
      - name: Serve the checked out dashboard
        run: python -m http.server 18943 --bind 127.0.0.1 --directory . >/tmp/begd-http.log 2>&1 &
      - name: Wait for the local dashboard
        run: curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:18943/begd/ -o /dev/null
      - name: Export all configured figures
        run: node tests/e2e/figure-downloads.cjs
