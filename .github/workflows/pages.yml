name: Refresh live data and publish BEGD
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Restore historical report cache
        uses: actions/cache@v4
        with:
          path: .cache/historical-reports
          key: begd-historical-reports-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            begd-historical-reports-
      - name: Restore validated BPDB costs
        uses: actions/cache@v4
        with:
          path: .cache/bpdb-costs
          key: begd-bpdb-costs-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            begd-bpdb-costs-v2-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen daily forecasts and their input cache
        uses: actions/cache@v4
        with:
          path: .cache/daily-forecasts
          key: begd-erp-independent-top3-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            begd-erp-independent-top3-v3-
      - name: Install parser and independent forecasting dependencies
        run: python -m pip install -r requirements-forecast.txt
      - name: Verify Power Grid TLS certificate chain
        run: |
          openssl s_client -connect erp.powergrid.gov.bd:443 -servername erp.powergrid.gov.bd -showcerts </dev/null 2>/dev/null | awk '/BEGIN CERTIFICATE/ { count++ } count == 1 { print } /END CERTIFICATE/ && count == 1 { exit }' > /tmp/erp-leaf.pem
          openssl x509 -in /tmp/erp-leaf.pem -noout >/dev/null
          current_cert=/tmp/erp-leaf.pem
          : > /tmp/erp-chain.pem
          verified=0
          for depth in 1 2 3 4; do
            issuer_url="$(openssl x509 -in "$current_cert" -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI:\([^[:space:]]*\).*/\1/p' | head -n 1)"
            if [ -z "$issuer_url" ]; then
              break
            fi
            case "$issuer_url" in
              http://crt.sectigo.com/*|https://crt.sectigo.com/*|http://*.i.lencr.org/*|https://*.i.lencr.org/*) ;;
              *) echo "Unexpected ERP certificate issuer URL: $issuer_url" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --proto '=http,https' --max-time 20 "$issuer_url" --output /tmp/erp-next-issuer.crt
            if openssl x509 -in /tmp/erp-next-issuer.crt -noout >/dev/null 2>&1; then
              openssl x509 -in /tmp/erp-next-issuer.crt -out /tmp/erp-next-issuer.pem
            else
              openssl x509 -inform DER -in /tmp/erp-next-issuer.crt -out /tmp/erp-next-issuer.pem
            fi
            if [ "$depth" -eq 1 ]; then
              cp /tmp/erp-next-issuer.pem /tmp/erp-issuer.pem
            fi
            cat /tmp/erp-next-issuer.pem >> /tmp/erp-chain.pem
            if openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted /tmp/erp-chain.pem /tmp/erp-leaf.pem; then
              verified=1
              break
            fi
            cp /tmp/erp-next-issuer.pem /tmp/erp-current-issuer.pem
            current_cert=/tmp/erp-current-issuer.pem
          done
          if [ "$verified" -ne 1 ]; then
            echo "Could not build a trusted ERP certificate chain." >&2
            exit 1
          fi
          python - <<'PY'
          import socket
          import ssl
          host = "erp.powergrid.gov.bd"
          context = ssl.create_default_context()
          context.load_verify_locations(cafile="/tmp/erp-issuer.pem")
          context.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          with socket.create_connection((host, 443), timeout=20) as connection:
              with context.wrap_socket(connection, server_hostname=host) as secure:
                  print("Verified ERP TLS peer:", secure.getpeercert()["issuer"])
          PY
          echo "BEGD_ERP_INTERMEDIATE_CERT=/tmp/erp-issuer.pem" >> "$GITHUB_ENV"
      - name: Build static site, ERP snapshot and frozen daily forecasts
        env:
          BEGD_PUBLISHED_FORECAST_BASE_URL: https://satyakibanik.github.io/Projects/begd/daily-forecasts
        run: python scripts/build_pages_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
