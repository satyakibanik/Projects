name: Refresh live data and publish BEGD
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Complete and verify Power Grid TLS chain
        run: |
          curl --fail --silent --show-error --location --proto '=http' --max-time 20 \
            http://crt.sectigo.com/SSL2BUYEMEARSADomainValidationSecureServerCA.crt \
            --output /tmp/erp-issuer.crt
          if openssl x509 -in /tmp/erp-issuer.crt -noout >/dev/null 2>&1; then
            cp /tmp/erp-issuer.crt /tmp/erp-issuer.pem
          else
            openssl x509 -inform DER -in /tmp/erp-issuer.crt -out /tmp/erp-issuer.pem
          fi
          openssl s_client -connect erp.powergrid.gov.bd:443 \
            -servername erp.powergrid.gov.bd -showcerts </dev/null 2>/dev/null |
            awk '/BEGIN CERTIFICATE/ { count++ } count == 1 { print } /END CERTIFICATE/ && count == 1 { exit }' \
              > /tmp/erp-leaf.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted /tmp/erp-issuer.pem /tmp/erp-leaf.pem
          cat /etc/ssl/certs/ca-certificates.crt /tmp/erp-issuer.pem \
            > /tmp/powergrid-ca-bundle.pem
          export CURL_CA_BUNDLE=/tmp/powergrid-ca-bundle.pem
          echo "CURL_CA_BUNDLE=/tmp/powergrid-ca-bundle.pem" >> "$GITHUB_ENV"
          echo "Using CA bundle: $CURL_CA_BUNDLE"
          curl --verbose --fail --location --noproxy '*' --cacert /tmp/powergrid-ca-bundle.pem --max-time 20 \
            https://erp.powergrid.gov.bd/web/generations/view_demand_supply_loadshed \
            --output /dev/null
      - name: Build static site and hourly ERP data
        run: python scripts/build_pages_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
